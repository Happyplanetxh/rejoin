name: Build Fabric Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft Mod
    runs-on: ubuntu-latest
    defaults:
      run:
        # 1. 修正为实际存在的目录名
        working-directory: LoginAssistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "Checking Gradle files..."
          test -f build.gradle || test -f build.gradle.kts
          test -f settings.gradle || test -f settings.gradle.kts

      - name: Build with Gradle
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon build
          else
            gradle --no-daemon build
          fi

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: LoginAssistant-JAR
          # 2. 路径必须同步加上子目录前缀
          path: LoginAssistant/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
